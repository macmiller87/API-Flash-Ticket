services:

  postgres:                         
    image: postgres           
    container_name: database
    restart: always                 
    ports:
      - "5432:5432"   
    environment:                 
      - POSTGRES_USER=${POSTGRES_USER_DOCKER}        
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD_DOCKER}   
      - POSTGRES_DB=${POSTGRES_DATABASE_DOCKER}       
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5  
    networks:
      - prisma-network

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    command: [
      "redis-server",
      "--user", "${REDIS_USER_DOCKER}", "on", ">${REDIS_PASSWORD_DOCKER}", "~*", "+@all",
      "--user", "default", "off"
    ]
    depends_on:
      postgres:
        condition: service_healthy                 
    networks:
      - prisma-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # API/Worker communication port (AMQP protocol)
      - "15672:15672" # Web Panel port (User: user / Pass: pass)
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER_DOCKER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_USER_PASSWORD}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy                 
    networks:
      - prisma-network

  app:
    build:
      dockerfile: Dockerfile       
    container_name: server      
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL_DOCKER} 
      - REDIS_URL=${REDIS_URL_DOCKER} 
      - RABBITMQ_URL=${RABBITMQ_URL_DOCKER}
    depends_on:
      postgres:
        condition: service_healthy                 
    networks:
      - prisma-network

networks:
  prisma-network:
    name: prisma-network